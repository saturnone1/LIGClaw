name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-powershell51-parse.ps1

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
